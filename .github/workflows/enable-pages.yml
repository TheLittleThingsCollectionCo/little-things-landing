name: Publish GitHub Pages

# Publishes the static root (index.html) with the Pages deployment API.
# Branch publishing could not be enabled by the cloud agent token, which
# lacks pages and administration permission.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Probe Pages deployment permission
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          status=$(curl -sS -D /tmp/pages-deploy.headers -o /tmp/pages-deploy.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/pages/deployments" \
            -d '{}')
          echo "deployments_status=${status}"
          grep -i '^x-accepted-github-permissions:' /tmp/pages-deploy.headers || true
          cat /tmp/pages-deploy.json
          echo
          if [ "${status}" = "403" ]; then
            echo "GITHUB_TOKEN cannot create Pages deployments."
            exit 1
          fi

      - name: Check out site
        uses: actions/checkout@v4

      - name: Stage static files
        run: |
          mkdir -p _site
          cp index.html CNAME README.md _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Enable GitHub Pages

# One-shot bootstrap. The cloud agent token can push code but does not have
# pages or administration permission, so this job uses the workflow token to
# publish from the main branch root.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main /
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          create_payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          create_status=$(curl -sS -o /tmp/pages-create.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d "${create_payload}")
          echo "create_status=${create_status}"
          cat /tmp/pages-create.json
          echo
          if [ "${create_status}" != "201" ] && [ "${create_status}" != "409" ]; then
            echo "GitHub Pages was not enabled."
            exit 1
          fi
          update_payload='{"cname":"thelittlethingscollection.com","build_type":"legacy","source":{"branch":"main","path":"/"}}'
          update_status=$(curl -sS -o /tmp/pages-update.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d "${update_payload}")
          echo "update_status=${update_status}"
          cat /tmp/pages-update.json
          echo
          if [ "${update_status}" != "204" ] && [ "${update_status}" != "200" ]; then
            echo "GitHub Pages source or custom domain was not saved."
            exit 1
          fi
          gh api "repos/${REPO}/pages"

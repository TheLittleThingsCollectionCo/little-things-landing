<!DOCTYPE html>
<html lang="en"><head><base target="_top"><meta charset="UTF-8">
<style>
*{box-sizing:border-box}body{margin:0;padding:32px 20px;background:#f7f3eb;color:#3a322c;font:17px/1.6 system-ui,sans-serif}
main{max-width:520px;margin:30px auto}h1{font:36px/1.2 Georgia,serif}label{display:block;margin:16px 0 6px}
input[type=email]{width:100%;padding:14px;border:1px solid #b8956c;border-radius:24px;font:inherit}
button{margin-top:20px;padding:14px 24px;border:0;border-radius:24px;background:#3a322c;color:#fff;font:inherit;cursor:pointer}
button:disabled{opacity:.6}.trap{position:absolute;left:-10000px}a{color:#765737}small{display:block;margin-top:18px}
</style></head><body><main>
<h1>The Little Things Collection</h1><p>Join our early access list.</p>
<form id="notify">
<label for="email">Email address</label><input type="email" id="email" autocomplete="email" maxlength="254" required>
<div class="trap" aria-hidden="true"><label for="website">Leave empty</label><input id="website" tabindex="-1" autocomplete="off"></div>
<label><input id="consent" type="checkbox" required> Email me when The Little Things Collection opens.</label>
<button type="submit">Notify me</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<small>We use Google Sheets to store your email and signup record for this launch notification. We do not sell your address. Request removal at <a href="mailto:hello@thelittlethingscollection.com">hello@thelittlethingscollection.com</a>.</small>
<p><a href="https://thelittlethingscollection.com/">Return to our website</a></p>
<script>
const token = '<?= token ?>';
const form = document.getElementById('notify');
const email = document.getElementById('email');
const status = document.getElementById('status');
const button = form.querySelector('button');
let requestId = crypto.randomUUID();
let attempt = 0;
email.addEventListener('input', () => { requestId = crypto.randomUUID(); });
form.addEventListener('submit', event => {
  event.preventDefault();
  if (button.disabled || !form.reportValidity()) return;
  const current = ++attempt;
  const sentId = requestId;
  button.disabled = true;
  email.readOnly = true;
  status.textContent = 'Sending…';
  const fail = () => {
    if (current !== attempt) return;
    clearTimeout(timer);
    attempt++;
    button.disabled = false;
    email.readOnly = false;
    status.textContent = 'Receipt could not be confirmed. Please retry. If this continues, reload this form. Your address may already have been received.';
  };
  const timer = setTimeout(fail, 25000);
  google.script.run.withSuccessHandler(result => {
    if (current !== attempt) return;
    if (!result || result.ok !== true || result.requestId !== sentId) { fail(); return; }
    clearTimeout(timer);
    attempt++;
    form.hidden = true;
    status.textContent = 'You’re on the list. We’ll email you when we open.';
  }).withFailureHandler(fail).submitWaitlist({
    token, requestId: sentId, email: email.value.trim(),
    consent: document.getElementById('consent').checked,
    website: document.getElementById('website').value
  });
});
</script></main></body></html>
